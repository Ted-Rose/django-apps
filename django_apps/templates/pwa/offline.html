<!DOCTYPE html>
<html lang="en">
<head>
    {% include "pwa/head.html" %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f0f8ff;
            color: #333;
        }
        h1 { color: #007bff; }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: 1px solid #007bff;
            border-radius: 6px;
            background: #007bff;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>You're offline</h1>
    <p>This page isn't available without a connection.<br>
       Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
</body>
</html>
