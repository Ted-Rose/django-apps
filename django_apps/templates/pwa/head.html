{% load static %}
{% comment %}
  Reusable PWA head snippet. Include inside any page's <head>:
      {% include "pwa/head.html" %}
  Provides the web app manifest link, theme colours, iOS/Android install
  meta tags, icons, and registers the service worker.
{% endcomment %}
<link rel="manifest" href="{% url 'manifest' %}">
<meta name="theme-color" content="#007bff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Tedis Tools">

<!-- Icons -->
<link rel="icon" type="image/svg+xml" href="{% static 'pwa/icons/icon.svg' %}">
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'pwa/icons/icon-192.png' %}">

<!-- iOS support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tedis Tools">
<link rel="apple-touch-icon" href="{% static 'pwa/icons/icon-192.png' %}">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      // On localhost the worker must never run: it stale-while-
      // revalidates /static/, which serves vite dev modules one
      // reload late. Clean up any earlier local registration and
      // its caches instead of registering.
      if (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
        caches.keys().then(function (keys) {
          keys.filter(function (k) { return k.indexOf('tedis-tools-') === 0; })
            .forEach(function (k) { caches.delete(k); });
        });
        return;
      }
      navigator.serviceWorker.register('{% url "service_worker" %}', { scope: '/' })
        .catch(function (err) { console.warn('SW registration failed:', err); });
    });
  }
</script>
