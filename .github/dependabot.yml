version: 2
updates:
  # Python deps from requirements.txt at the repo root (a single
  # "pip" entry on "/" covers every manifest in that directory).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Batch non-breaking bumps into one PR to cut review noise.
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  # React/Vite SPA workspace (frontend/package.json).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Batch non-breaking updates into single PRs to avoid
      # package-lock.json conflicts between Dependabot branches.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
