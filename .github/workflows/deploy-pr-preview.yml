name: Deploy PR preview to Cloud Run

# Per-PR ephemeral Cloud Run preview (django-apps-pr-<num>).
# Cost/abuse posture:
#   - --no-allow-unauthenticated: unauthenticated requests are
#     rejected by Google's edge with 403 before any container starts,
#     so the URL cannot be abused into spend.
#   - --min-instances=0: idles at zero.
#   - The cleanup job deletes the service when the PR closes.
# Browse a preview via:
#   gcloud run services proxy django-apps-pr-<num> \
#     --region=europe-west3 --project=django-apps-7345
# (requires roles/run.invoker). Manual workflow_dispatch previews are
# not auto-deleted — remove them with `gcloud run services delete`.

on:
  # PR previews disabled to avoid Artifact Registry image buildup.
  # Uncomment the pull_request block below to re-enable automatic
  # private previews; workflow_dispatch still deploys one manually.
  # pull_request:
  #   branches: [main]
  #   types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One preview service per PR; serialize repeat pushes to the same PR.
concurrency: pr-preview-${{ github.event.pull_request.number || 'staging' }}

env:
  GCP_PROJECT_ID: django-apps-7345
  GCP_REGION: europe-west3
  WIF_PROVIDER: projects/356166814755/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOY_SA: github-deployer@django-apps-7345.iam.gserviceaccount.com
  ARTIFACT_REGISTRY: europe-west3-docker.pkg.dev/django-apps-7345/gae-standard
  SERVICE_NAME: django-apps-pr-${{ github.event.pull_request.number || 'staging' }}

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          REPO=${{ env.ARTIFACT_REGISTRY }}
          IMAGE=$REPO/django-apps-preview:$SERVICE_NAME
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Previews share the single env-file secret — settings.py parses
      # DOTENV exactly like a local .env file. Note APP_BASE_URL inside
      # env-file still points at production, so OAuth login redirects
      # there; the preview is for checking pages render, not full auth.
      - name: Deploy preview service (private)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="$IMAGE" \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --service-account=cloudrun-sa@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --min-instances=0 \
            --max-instances=1 \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --set-secrets=DOTENV=env-file:latest \
            --set-env-vars=GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }},GCS_AUDIO_BUCKET=${{ env.GCP_PROJECT_ID }}-audio-recordings \
            --project=${{ env.GCP_PROJECT_ID }}

      # WIF credentials cannot mint Cloud Run identity tokens, so the
      # smoke check verifies the two properties that matter: the
      # revision reports Ready (container built, started, healthy)
      # and unauthenticated traffic is rejected at the edge with 403
      # (no container start, no spend).
      - name: Smoke check (private)
        run: |
          set -euo pipefail
          READY=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format=json | python3 -c \
            "import sys, json; c={x['type']: x['status'] for x in json.load(sys.stdin)['status']['conditions']}; print(c.get('Ready', ''))")
          echo "Ready condition: $READY"
          test "$READY" = "True"

          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/admin/login/")
          echo "GET /admin/login/ (unauthenticated) -> $CODE"
          test "$CODE" = "403"

      - name: Show preview access
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "Preview URL (private): $URL"
          echo "Browse via: gcloud run services proxy ${{ env.SERVICE_NAME }} --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }}"

  cleanup:
    # Delete the PR's preview service when the pull request closes
    # (merged or not) so previews never outlive their review.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Delete preview service
        run: |
          gcloud run services delete ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet \
            || echo "Preview service ${{ env.SERVICE_NAME }} not found - nothing to delete"
