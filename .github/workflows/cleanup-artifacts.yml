name: Cleanup Artifact Registry

on:
  # Run after successful deployments
  workflow_run:
    workflows: ["Deploy to Cloud Run"]
    types:
      - completed
  # Run daily to catch any stragglers
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gmail-vercel
  GCP_REGION: europe-west3
  WIF_PROVIDER: projects/383533976302/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOY_SA: github-deployer@gmail-vercel.iam.gserviceaccount.com
  ARTIFACT_REGISTRY: europe-west3-docker.pkg.dev/gmail-vercel/gae-standard
  SERVICE_NAME: django-apps

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Only run if the deployment succeeded or on schedule/manual trigger
    if: |
      github.event_name == 'schedule' || 
      github.event_name == 'workflow_dispatch' || 
      github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Cleanup old images
        run: |
          set -e  # Exit on any error
          echo "Cleaning up old images from Artifact Registry..."
          
          # Get all tags sorted by creation time (newest first)
          TAGS=$(gcloud artifacts docker tags list \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }} \
            --format="value(tag,version)" \
            --sort-by=~UPDATE_TIME \
            --project=${{ env.GCP_PROJECT_ID }})
          
          if [ -z "$TAGS" ]; then
            echo "No tagged images found in registry"
            exit 0
          fi
          
          # Count total tags
          TOTAL_COUNT=$(echo "$TAGS" | wc -l | tr -d ' ')
          echo "Found $TOTAL_COUNT tagged image(s) in registry"
          
          # Keep only the most recent tag (skip first line)
          TAGS_TO_DELETE=$(echo "$TAGS" | tail -n +2)
          
          if [ -z "$TAGS_TO_DELETE" ]; then
            echo "Only 1 tagged image exists. Nothing to delete."
            exit 0
          fi
          
          DELETE_COUNT=$(echo "$TAGS_TO_DELETE" | wc -l | tr -d ' ')
          echo "Deleting $DELETE_COUNT old tagged image(s)..."
          
          # Track failures
          FAILED=0
          DELETED_DIGESTS=()
          
          # First, delete all old tags
          while IFS=$'\t' read -r tag version; do
            if [ -n "$tag" ]; then
              TAG_PATH="${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:${tag}"
              echo "Deleting tag: $TAG_PATH"
              
              if ! gcloud artifacts docker tags delete "$TAG_PATH" \
                --quiet \
                --project=${{ env.GCP_PROJECT_ID }} 2>&1; then
                echo "ERROR: Failed to delete tag $TAG_PATH"
                FAILED=$((FAILED + 1))
              else
                echo "Successfully deleted tag $TAG_PATH"
                # Store the digest for later cleanup
                if [ -n "$version" ]; then
                  DELETED_DIGESTS+=("$version")
                fi
              fi
            fi
          done <<< "$TAGS_TO_DELETE"
          
          # Now delete untagged images (those we just untagged)
          echo ""
          echo "Deleting untagged images..."
          for digest in "${DELETED_DIGESTS[@]}"; do
            if [ -n "$digest" ]; then
              IMAGE_PATH="${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}@${digest}"
              echo "Deleting untagged image: $IMAGE_PATH"
              
              if ! gcloud artifacts docker images delete "$IMAGE_PATH" \
                --quiet \
                --project=${{ env.GCP_PROJECT_ID }} 2>&1; then
                echo "WARNING: Failed to delete untagged image $IMAGE_PATH (may have been auto-cleaned)"
                # Don't count as failure - GCP may have auto-cleaned it
              else
                echo "Successfully deleted untagged image"
              fi
            fi
          done
          
          # Fail the job if any tag deletions failed
          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "ERROR: $FAILED tag(s) failed to delete"
            exit 1
          fi
          
          echo ""
          echo "Cleanup complete! All old images deleted successfully."
          
          # Show remaining images
          echo ""
          echo "Remaining tagged images:"
          gcloud artifacts docker tags list \
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }} \
            --format="table(tag,version.slice(7:26),UPDATE_TIME)" \
            --sort-by=~UPDATE_TIME \
            --project=${{ env.GCP_PROJECT_ID }}

      - name: Report storage usage
        run: |
          echo "Current Artifact Registry storage usage:"
          gcloud artifacts repositories describe gae-standard \
            --location=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format="value(sizeBytes)" | awk '{
              size=$1
              if (size == "") {
                print "0 bytes"
              } else if (size < 1024) {
                printf "%.2f bytes\n", size
              } else if (size < 1048576) {
                printf "%.2f KB\n", size/1024
              } else if (size < 1073741824) {
                printf "%.2f MB\n", size/1048576
              } else {
                printf "%.2f GB\n", size/1073741824
              }
            }' || echo "Unable to retrieve storage size"
