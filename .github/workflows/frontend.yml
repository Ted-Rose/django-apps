name: Frontend

# Runs on every PR and every push to main (every push deploys to
# Cloud Run via deploy.yml), so type/lint/test breakage can't reach
# production unchecked — even when a change doesn't touch frontend/.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        working-directory: .
        run: pip install -r requirements.txt

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      - name: OpenAPI drift check
        working-directory: .
        run: |
          # Regenerate frontend/openapi.json from the django-ninja API
          # itself, so a PR that edits */api.py without re-dumping the
          # spec fails here — diffing only api-types.ts would never
          # catch that drift. Settings import needs a
          # config.yaml; reuse the Dockerfile's build-time
          # dummy (no secrets, in-memory sqlite).
          python -c "import yaml; yaml.safe_dump({'SECRET_KEY': 'build-time-dummy', 'DEBUG': False, 'BASE_URL': '', 'DATABASES': {'default': {'ENGINE': 'django.db.backends.sqlite3', 'NAME': ':memory:'}}}, open('config.yaml', 'w'))"
          python manage.py export_openapi_schema --output frontend/openapi.json
          rm config.yaml
          # --porcelain catches deleted/untracked files too, which
          # `git diff --exit-code` would silently miss.
          if [ -n "$(git status --porcelain -- frontend/openapi.json)" ]; then
            echo "frontend/openapi.json is stale — run:"
            echo "  python manage.py export_openapi_schema --output frontend/openapi.json"
            git diff -- frontend/openapi.json
            exit 1
          fi

          cd frontend
          npm run gen:types
          # Per-entry generated types (src/<entry>/api-types.ts) —
          # the git pathspec glob catches a stale file in any entry.
          if [ -n "$(git status --porcelain -- 'src/*/api-types.ts')" ]; then
            echo "src/*/api-types.ts is stale — run: npm run gen:types"
            git status -- 'src/*/api-types.ts'
            exit 1
          fi
