name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Serialize with terraform.yml: both mutate the same Cloud Run
# service/jobs and race when triggered by the same push.
concurrency: gcp-main

env:
  GCP_PROJECT_ID: django-apps-7345
  GCP_REGION: europe-west3
  WIF_PROVIDER: projects/356166814755/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOY_SA: github-deployer@django-apps-7345.iam.gserviceaccount.com
  SERVICE_NAME: django-apps
  ARTIFACT_REGISTRY: europe-west3-docker.pkg.dev/django-apps-7345/gae-standard

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
                       -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:latest .

      - name: Push Docker image
        run: |
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:latest

      - name: Set up Python for migrations
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs directly on the runner: Aiven Postgres is publicly
      # reachable and sslmode=require needs no CA cert. Secrets are
      # pulled from GCP Secret Manager at run time (WIF SA already has
      # secretAccessor) so they live only in GCP.
      - name: Run database migrations
        run: |
          export DATABASE_URL="$(gcloud secrets versions access latest \
            --secret=DATABASE_URL --project=${{ env.GCP_PROJECT_ID }})"
          export DJANGO_SECRET_KEY="$(gcloud secrets versions access latest \
            --secret=DJANGO_SECRET_KEY --project=${{ env.GCP_PROJECT_ID }})"
          USE_GCP_SECRETS=true python manage.py migrate --noinput

      - name: Deploy to Cloud Run
        # Deploy :latest, not the SHA tag: the Artifact Registry
        # cleanup policy deletes versions older than 24h, and a
        # deployed SHA reference would go stale — terraform then
        # fails with "image not found" on its next update.
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:latest \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=cloudrun-sa@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --min-instances=0 \
            --max-instances=1 \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --set-env-vars=GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }},GCS_AUDIO_BUCKET=${{ env.GCP_PROJECT_ID }}-audio-recordings \
            --project=${{ env.GCP_PROJECT_ID }}

      - name: Update Cloud Run Jobs image
        run: |
          for JOB in sync-bank-transactions evaluate-spending-limits check-balance-alerts; do
            gcloud run jobs update $JOB \
              --image=${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:latest \
              --region=${{ env.GCP_REGION }} \
              --project=${{ env.GCP_PROJECT_ID }} \
              || echo "Job $JOB not yet created (terraform pending)"
          done

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)'
