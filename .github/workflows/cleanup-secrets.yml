name: Cleanup stale secret versions

on:
  # Run after successful deployments
  workflow_run:
    workflows: ["Deploy to Cloud Run"]
    types:
      - completed
  # Run daily: Secret Manager bills per enabled version, and stale
  # versions pile up whenever a secret is rotated by hand.
  schedule:
    - cron: '15 4 * * *'  # 4:15 AM UTC daily
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: django-apps-7345
  WIF_PROVIDER: projects/356166814755/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOY_SA: github-deployer@django-apps-7345.iam.gserviceaccount.com

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Only run if the deployment succeeded or on schedule/manual trigger
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Destroy stale secret versions
        run: |
          set -e
          echo "Destroying all secret versions except the newest per secret..."

          DESTROYED_COUNT=0
          FAILED=0

          for SECRET in $(gcloud secrets list \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format="value(name)"); do

            # 'latest' always resolves to the newest version, and
            # Cloud Run references secrets as 'latest', so the newest
            # version must survive no matter what state it is in.
            VERSIONS=$(gcloud secrets versions list "$SECRET" \
              --project=${{ env.GCP_PROJECT_ID }} \
              --filter="state != DESTROYED" \
              --format="value(name)" | sed 's|.*/versions/||')

            TOTAL=$(echo "$VERSIONS" | wc -l | tr -d ' ')
            echo "Secret $SECRET: $TOTAL live version(s)"

            # Version numbers are monotonically increasing; sort -rn
            # puts the newest first, tail drops it from the hit list.
            for VERSION in $(echo "$VERSIONS" | sort -rn | tail -n +2); do
              if gcloud secrets versions destroy "$VERSION" \
                --secret="$SECRET" \
                --project=${{ env.GCP_PROJECT_ID }} \
                --quiet 2>&1; then
                echo "  Destroyed $SECRET version $VERSION"
                DESTROYED_COUNT=$((DESTROYED_COUNT + 1))
              else
                echo "  ERROR: failed to destroy $SECRET version $VERSION"
                FAILED=$((FAILED + 1))
              fi
            done
          done

          echo ""
          echo "Destroyed $DESTROYED_COUNT stale version(s)."

          if [ $FAILED -gt 0 ]; then
            echo "ERROR: $FAILED version(s) failed to destroy"
            exit 1
          fi

      - name: Report remaining versions
        run: |
          echo "Remaining versions per secret:"
          for SECRET in $(gcloud secrets list \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format="value(name)"); do
            ENABLED=$(gcloud secrets versions list "$SECRET" \
              --project=${{ env.GCP_PROJECT_ID }} \
              --filter="state=ENABLED" \
              --format="value(name)" | wc -l | tr -d ' ')
            echo "  $SECRET: $ENABLED enabled"
          done
